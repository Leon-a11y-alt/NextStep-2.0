# frontend.yaml — NextStep frontend (Next.js standalone)
# Deploys the frontend image from GHCR. Traffic normally arrives through the
# Ingress (see ingress.yaml), which is the single public entry point on port
# 80; the NodePort below is kept as a direct-to-service fallback for debugging.
#
# NOTE: the backend API URL (NEXT_PUBLIC_API_URL) is baked into the image
# at BUILD time, not read at runtime. It is set from the repo variable of the
# same name (currently http://34.124.158.162 — no port, because the Ingress
# routes /api to the backend on port 80). If that address changes, the frontend
# image must be rebuilt and pushed — it can't be fixed by editing this manifest.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/leon-a11y-alt/nextstep-2.0/frontend:latest
          ports:
            - containerPort: 3000  # Next.js standalone server port
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:            # don't send traffic until the page actually serves
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
          livenessProbe:             # restart the pod if it stops responding
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort                     # reachable directly, but the Ingress is the front door
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080                # debug path: http://<VM-public-IP>:30080
