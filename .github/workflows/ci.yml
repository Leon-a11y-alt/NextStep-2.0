# ─────────────────────────────────────────────────────────────────────────────
# NextStep — Continuous Integration (CI)
#
# WHAT THIS DOES
#   Every push and every pull request is automatically verified by GitHub
#   Actions before anyone merges it. Six stages run:
#
#     1. quality        — repo hygiene: no committed secrets, no node_modules,
#                         lockfiles present, every JS file parses
#     2. backend-test   — spin up a real PostgreSQL, seed it, run the API tests,
#                         then boot the server and hit /api/health (smoke test)
#     3. frontend-build — production `next build` must compile
#     4. security-fs    — Trivy scans the repo for vulnerable dependencies,
#                         committed secrets and insecure IaC; CRITICAL fails
#     5. docker-build   — both Dockerfiles must build, then Trivy scans the
#                         built IMAGES; CRITICAL fails (needs 2 + 3)
#     6. ci-result      — single aggregate status check for branch protection
#
#   HOW THEY'RE ORDERED. Stages 1, 2 and 3 start at once — none depends on
#   another, so a full run is only as slow as its longest chain. Stage 4 waits
#   for stage 1: a repo that fails basic hygiene isn't worth spending a
#   vulnerability scan on. Stage 5 waits for 2 and 3, because there's no point
#   building images from code that doesn't test or compile.
#
#   If any stage fails, the commit/PR is marked ✗ on GitHub and the pipeline
#   stops — so broken code never reaches `main`. cd.yml reuses this whole file
#   as its gate, so nothing is ever published or deployed without it passing.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]
  # Lets us press "Run workflow" by hand in the Actions tab (useful for a demo).
  workflow_dispatch:
  # Lets other workflows reuse this one (see cd.yml).
  workflow_call:

# If you push twice quickly, cancel the older run instead of paying for both.
#
# The group MUST include ${{ github.workflow }}. cd.yml calls this file as a
# reusable workflow, and a called workflow re-evaluates its own concurrency
# block — with a hard-coded "ci-" prefix the CD-invoked run and the standalone
# run landed in the SAME group on main and cancelled each other on every push.
# github.workflow resolves to the CALLER's name, so the two now read
# "CI-refs/heads/main" and "CD-refs/heads/main" and coexist.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. QUALITY GATE — cheap checks that fail fast
  # ───────────────────────────────────────────────────────────────────────────
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: No .env files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.local)?$'; then
            echo "::error::A real .env file is committed. Remove it — only .env.example belongs in git."
            exit 1
          fi
          echo "OK: no .env files tracked by git."

      - name: No node_modules or build output committed
        run: |
          if git ls-files | grep -E '(^|/)(node_modules|\.next)/'; then
            echo "::error::node_modules or .next is committed. Check .gitignore."
            exit 1
          fi
          echo "OK: repository is clean."

      - name: Lockfiles present (required for reproducible installs)
        run: |
          for f in backend/package-lock.json frontend/package-lock.json; do
            test -f "$f" || { echo "::error::$f is missing"; exit 1; }
          done
          echo "OK: both lockfiles present."

      # Cheapest possible correctness gate, and it needs no dependencies: the
      # V8 parser itself. A typo that makes a file unparseable fails here in
      # seconds instead of at runtime inside a container.
      - name: Every JavaScript file parses
        run: |
          set -euo pipefail
          FILES=$(git ls-files '*.js' '*.mjs' | grep -v -E '(^|/)node_modules/' || true)
          COUNT=0
          for f in $FILES; do
            node --check "$f" || { echo "::error file=$f::syntax error"; exit 1; }
            COUNT=$((COUNT + 1))
          done
          echo "OK: $COUNT JavaScript files parse cleanly."

  # ───────────────────────────────────────────────────────────────────────────
  # 2. BACKEND TESTS — against a real, disposable PostgreSQL database
  # ───────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest

    # A throwaway Postgres container that lives only for this job. This is why
    # the pipeline can run the real API tests without touching the team's
    # Supabase database — CI gets its own clean copy every single time.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nextstep_test
        ports:
          - 5432:5432
        # Don't start our steps until Postgres says it is ready to accept
        # connections, otherwise db:init would race it and fail.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nextstep_test
      DATABASE_SSL: disable # the CI container has no SSL (Supabase does)
      PORT: "4000"

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` (not `npm install`) — installs exactly what the lockfile says,
      # so CI builds the same dependency tree every run.
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Create the schema and seed data
        working-directory: backend
        run: npm run db:init

      - name: Run the API test suite
        working-directory: backend
        run: npm test

      # Smoke test: a passing unit test doesn't prove the app actually boots.
      - name: Smoke test — the API starts and answers /api/health
        working-directory: backend
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:4000/api/health > /tmp/health.json; then
              echo "Health response: $(cat /tmp/health.json)"
              kill $SERVER_PID
              exit 0
            fi
            sleep 2
          done
          echo "::error::The API never became healthy."
          kill $SERVER_PID || true
          exit 1

  # ───────────────────────────────────────────────────────────────────────────
  # 3. FRONTEND BUILD — the Next.js production build must compile
  # ───────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the production bundle
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run build

      # Keeps the compiled output attached to the run so you can download and
      # inspect exactly what this commit produced.
      - name: Upload the build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend/.next/standalone
          retention-days: 7
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # 4. SECURITY — Trivy filesystem scan (DevSecOps gate #1)
  #
  #    Scans the repository itself, three ways at once:
  #      • vuln     — known CVEs in backend/ and frontend/ dependency trees,
  #                   read straight from the lockfiles
  #      • secret   — credentials accidentally committed (keys, tokens, PEMs)
  #      • misconfig— insecure Dockerfile / docker-compose / Kubernetes settings
  #
  #    Two passes on purpose. The REPORT pass prints everything and uploads
  #    SARIF to the repository's Security tab, so nothing is hidden. The GATE
  #    pass fails the build only on CRITICAL findings that actually have a fix
  #    available (--ignore-unfixed) — a gate nobody can act on just teaches the
  #    team to ignore the pipeline.
  # ───────────────────────────────────────────────────────────────────────────
  security-fs:
    name: Security — Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]
    permissions:
      contents: read
      security-events: write # to publish SARIF to the Security tab
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Installed from the official script rather than pinning a version we
      # cannot verify offline; the version actually used is printed below.
      - name: Install Trivy
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Report — vulnerabilities, secrets and misconfigurations
        run: |
          set -euo pipefail
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --format table \
            --no-progress \
            --exit-code 0 | tee trivy-fs.txt

      - name: Publish the findings to the run summary
        if: always()
        run: |
          {
            echo "### 4 · Trivy filesystem scan :mag:"
            echo ""
            echo '<details><summary>Full report</summary>'
            echo ""
            echo '```'
            tail -c 40000 trivy-fs.txt || true
            echo '```'
            echo ""
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Produce SARIF for the Security tab
        if: always()
        run: |
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --format sarif \
            --no-progress \
            --output trivy-fs.sarif \
            --exit-code 0

      - name: Upload SARIF
        if: always()
        continue-on-error: true # code scanning may be disabled on the repo
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

      - name: Upload the raw report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-report
          path: |
            trivy-fs.txt
            trivy-fs.sarif
          retention-days: 7
          if-no-files-found: ignore

      # THE GATE. Anything CRITICAL with a fix available stops the pipeline.
      #
      # It reports each blocking finding as a GitHub annotation — the package,
      # the version installed, and the version that fixes it — so whoever hits
      # this knows exactly what to bump without opening the raw log.
      - name: Gate — fail on fixable CRITICAL findings
        run: |
          set -euo pipefail
          trivy fs . \
            --scanners vuln,secret \
            --severity CRITICAL \
            --ignore-unfixed \
            --format json \
            --no-progress \
            --output gate-fs.json \
            --exit-code 0
          node .github/scripts/trivy-gate.mjs gate-fs.json "filesystem"

  # ───────────────────────────────────────────────────────────────────────────
  # 5. DOCKER IMAGE BUILD + IMAGE SCAN (DevSecOps gate #2)
  #
  #    Proves both containers still build, then scans the built images — OS
  #    packages and application dependencies inside the layers, which the
  #    filesystem scan above cannot see. Build only, no push; publishing
  #    happens in the CD pipeline, which re-scans what it published.
  # ───────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker images build + Trivy image scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-test, frontend-build]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `load: true` puts the image into the local Docker daemon so Trivy can
      # scan the exact artifact this commit produces.
      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: nextstep-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: nextstep-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Install Trivy
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Report — scan both images
        run: |
          set -euo pipefail
          for img in nextstep-backend:ci nextstep-frontend:ci; do
            echo "::group::Trivy image scan — $img"
            trivy image "$img" \
              --scanners vuln,secret \
              --severity HIGH,CRITICAL \
              --format table \
              --no-progress \
              --exit-code 0 | tee -a trivy-images.txt
            echo "::endgroup::"
          done

      - name: Produce SARIF for the Security tab
        if: always()
        run: |
          for img in backend frontend; do
            trivy image "nextstep-$img:ci" \
              --scanners vuln \
              --format sarif \
              --no-progress \
              --output "trivy-image-$img.sarif" \
              --exit-code 0 || true
          done

      - name: Upload backend image SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-backend.sarif
          category: trivy-image-backend

      - name: Upload frontend image SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-frontend.sarif
          category: trivy-image-frontend

      - name: Upload the image scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports
          path: |
            trivy-images.txt
            trivy-image-*.sarif
          retention-days: 7
          if-no-files-found: ignore

      # THE GATE. A fixable CRITICAL inside an image means the base image or a
      # dependency needs bumping before this can ship.
      - name: Gate — fail on fixable CRITICAL findings in either image
        run: |
          set -euo pipefail
          FAILED=0
          for svc in backend frontend; do
            trivy image "nextstep-$svc:ci" \
              --scanners vuln \
              --severity CRITICAL \
              --ignore-unfixed \
              --format json \
              --no-progress \
              --output "gate-$svc.json" \
              --exit-code 0
            node .github/scripts/trivy-gate.mjs "gate-$svc.json" "$svc image" || FAILED=1
          done
          exit $FAILED

      - name: Image scan summary
        if: always()
        run: |
          {
            echo "### 5 · Trivy image scan :whale:"
            echo ""
            echo '<details><summary>Full report (HIGH + CRITICAL)</summary>'
            echo ""
            echo '```'
            tail -c 40000 trivy-images.txt || true
            echo '```'
            echo ""
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # 6. CI RESULT — one status check to rule them all
  #
  #    Branch protection points at this single job, so adding a stage above
  #    never means reconfiguring the protected-branch rules. It runs even when
  #    an upstream job failed, publishes the table, then fails if anything
  #    upstream did.
  # ───────────────────────────────────────────────────────────────────────────
  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [quality, backend-test, frontend-build, security-fs, docker-build]
    steps:
      - name: Summarise every stage
        env:
          R_QUALITY: ${{ needs.quality.result }}
          R_BACKEND: ${{ needs.backend-test.result }}
          R_FRONTEND: ${{ needs.frontend-build.result }}
          R_SECURITY: ${{ needs.security-fs.result }}
          R_DOCKER: ${{ needs.docker-build.result }}
        run: |
          icon() { case "$1" in success) echo ":white_check_mark:";; skipped) echo ":fast_forward:";; *) echo ":x:";; esac; }

          {
            echo "## CI summary — \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::7}\`"
            echo ""
            echo "| # | Stage | Result |"
            echo "| --- | --- | --- |"
            echo "| 1 | Quality checks (hygiene + syntax) | $(icon "$R_QUALITY") $R_QUALITY |"
            echo "| 2 | Backend tests (real PostgreSQL + smoke test) | $(icon "$R_BACKEND") $R_BACKEND |"
            echo "| 3 | Frontend build (Next.js) | $(icon "$R_FRONTEND") $R_FRONTEND |"
            echo "| 4 | Trivy filesystem scan | $(icon "$R_SECURITY") $R_SECURITY |"
            echo "| 5 | Docker build + Trivy image scan | $(icon "$R_DOCKER") $R_DOCKER |"
          } >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          for r in "$R_QUALITY" "$R_BACKEND" "$R_FRONTEND" "$R_SECURITY" "$R_DOCKER"; do
            case "$r" in success|skipped) ;; *) FAILED=1 ;; esac
          done

          if [ "$FAILED" = "1" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**This commit is not safe to merge or deploy.**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::One or more CI stages failed."
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**All gates green — commit \`${GITHUB_SHA::7}\` is safe to merge and deploy.**" >> "$GITHUB_STEP_SUMMARY"
