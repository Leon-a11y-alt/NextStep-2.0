# Production/staging stack — runs the images the CD pipeline published to GHCR
# instead of building from source. This is the file cd.yml copies to the server.
#
# Usage on the server:
#   export IMAGE_REPO=ghcr.io/leon-a11y-alt/nextstep-2.0
#   export IMAGE_TAG=<commit-sha>          # or "latest"
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Rolling back is just re-running the two commands with an older IMAGE_TAG.
services:
  backend:
    image: ${IMAGE_REPO:-ghcr.io/leon-a11y-alt/nextstep-2.0}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "4000:4000"
    # DATABASE_URL and the other secrets live in a .env file on the server —
    # they are never baked into the image and never committed to git.
    env_file:
      - .env

  frontend:
    image: ${IMAGE_REPO:-ghcr.io/leon-a11y-alt/nextstep-2.0}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
