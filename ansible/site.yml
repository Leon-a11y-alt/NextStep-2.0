---
- name: Configure NextStep AWS EC2 server
  hosts: nextstep_servers
  become: true

  tasks:
    - name: Update Ubuntu package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name: "{{ required_packages }}"
        state: present

    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present

    - name: Install Docker Compose plugin
      ansible.builtin.apt:
        name: docker-compose-v2
        state: present

    - name: Start and enable Docker
      ansible.builtin.systemd:
        name: "{{ docker_service_name }}"
        state: started
        enabled: true

    - name: Add deployment user to Docker group
      ansible.builtin.user:
        name: "{{ deployment_user }}"
        groups: docker
        append: true

    - name: Create NextStep deployment directory
      ansible.builtin.file:
        path: "{{ deployment_path }}"
        state: directory
        owner: "{{ deployment_user }}"
        group: "{{ deployment_user }}"
        mode: "0755"

    - name: Copy production Docker Compose file
      ansible.builtin.copy:
        src: files/docker-compose.prod.yml
        dest: "{{ deployment_path }}/docker-compose.prod.yml"
        owner: "{{ deployment_user }}"
        group: "{{ deployment_user }}"
        mode: "0644"

    - name: Check Docker version
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        var: docker_version.stdout

    - name: Check Docker Compose version
      ansible.builtin.command:
        cmd: docker compose version
      register: compose_version
      changed_when: false

    - name: Display Docker Compose version
      ansible.builtin.debug:
        var: compose_version.stdout